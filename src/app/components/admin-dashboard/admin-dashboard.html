<div class="row">
  <div class="col-md-6">
    <h3>{{ isEditing ? 'Edit post:' : 'Create new post:' }}</h3>
    
    <div class="mb-3">
        <label for="heading" class="form-label">Heading</label>
        <input type="text" class="form-control" required [(ngModel)]="currentPost.heading">
    </div>
    <div class="mb-3">
        <label for="summary" class="form-label">Summary</label>
        <input type="text" class="form-control" [(ngModel)]="currentPost.summary">
    </div>
    <div class="mb-3">
        <label for="body" class="form-label">Body</label>
        <textarea class="form-control" [(ngModel)]="currentPost.body" rows="10"></textarea>
    </div>
    <button type="button" class="btn btn-primary" (click)="savePost()">{{ isEditing ? 'Update' : 'Submit' }}</button>
    <button type="button" class="btn btn-secondary ms-2" *ngIf="isEditing" (click)="cancelEdit()">Cancel</button>
  </div>

  <div class="col-md-6 mt-4 mt-md-0">
    <h3>Existing Posts</h3>
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let post of posts">
        <strong>{{ post.heading }}</strong>
        <div>
          <button class="btn btn-sm btn-outline-primary me-2" (click)="editPost(post)">Edit</button>
          <button class="btn btn-sm btn-outline-danger" (click)="deletePost(post.id)">Delete</button>
        </div>
      </li>
      <li class="list-group-item text-muted text-center" *ngIf="posts.length === 0">No posts yet.</li>
    </ul>
  </div>
</div>
